<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sebas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            overflow: hidden;
        }

        .image-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            animation: fadeIn 3s ease-out forwards, zoomIn 15s ease-out forwards, zoomBounce 8s ease-in-out 15s infinite;
            transform-origin: top center;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes zoomIn {
            from { transform: scale(1); }
            to { transform: scale(1.15); }
        }

        @keyframes zoomBounce {
            0%, 100% { transform: scale(1.15); }
            50% { transform: scale(1.05); }
        }

        .dialogue-box {
            position: fixed;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #444;
            border-radius: 8px;
            padding: 30px 50px;
            max-width: 80%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease-out;
        }

        .dialogue-box.visible {
            opacity: 1;
        }

        .dialogue-text {
            color: #fff;
            font-size: 28px;
            text-align: center;
            font-style: italic;
            line-height: 1.6;
            letter-spacing: 1px;
        }

        .next-arrow {
            position: absolute;
            right: 15px;
            bottom: 15px;
            width: 0;
            height: 0;
            border-left: 10px solid #fff;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            opacity: 0;
            animation: pulseArrow 1s ease-in-out infinite;
        }

        .next-arrow.visible {
            opacity: 1;
        }

        @keyframes pulseArrow {
            0%, 100% { opacity: 0.4; transform: translateX(0); }
            50% { opacity: 1; transform: translateX(3px); }
        }

        .choice-button {
            position: fixed;
            top: 50%;
            padding: 20px 40px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0;
            transform: translateY(-50%) scale(0.8);
            pointer-events: none;
            z-index: 100;
            transition: opacity 1s ease-out, transform 1s ease-out, background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .choice-button.visible {
            opacity: 1;
            transform: translateY(-50%) scale(1);
            pointer-events: auto;
        }

        .choice-button.hidden {
            opacity: 0;
            transform: translateY(-50%) scale(0.8);
            pointer-events: none;
            transition: opacity 0.4s ease-out, transform 0.4s ease-out;
        }

        .button-yes {
            left: 5%;
            background-color: #16a34a;
            box-shadow: 0 8px 32px rgba(22, 163, 74, 0.4);
        }

        .button-yes.visible:hover {
            background-color: #15803d;
            transform: translateY(-50%) translateY(-4px) scale(1);
            box-shadow: 0 12px 40px rgba(22, 163, 74, 0.5);
        }

        .button-no {
            right: 5%;
            background-color: #dc2626;
            box-shadow: 0 8px 32px rgba(220, 38, 38, 0.4);
        }

        .button-no.visible:hover {
            background-color: #b91c1c;
            transform: translateY(-50%) translateY(-4px) scale(1);
            box-shadow: 0 12px 40px rgba(220, 38, 38, 0.5);
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img src="img/1.webp" alt="Sebas">
    </div>

    <div class="dialogue-box" id="dialogueBox">
        <p class="dialogue-text" id="dialogue"></p>
        <div class="next-arrow" id="nextArrow"></div>
    </div>

    <button class="choice-button button-yes" id="yesButton">
        Comer una verga
    </button>

    <button class="choice-button button-no" id="noButton">
        No comer una verga
    </button>

    <script>
        const dialogueBox = document.getElementById('dialogueBox');
        const dialogueElement = document.getElementById('dialogue');
        const nextArrow = document.getElementById('nextArrow');
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');

        let isTyping = false;
        let typingTimeout = null;
        let currentText = '';
        let charIndex = 0;
        let choiceMade = false;

        function typeText(text) {
            isTyping = true;
            nextArrow.classList.remove('visible');
            dialogueElement.textContent = '';
            currentText = text;
            charIndex = 0;

            function typeChar() {
                if (charIndex < currentText.length) {
                    dialogueElement.textContent += currentText[charIndex];
                    charIndex++;
                    typingTimeout = setTimeout(typeChar, 60);
                } else {
                    isTyping = false;
                    nextArrow.classList.add('visible');
                }
            }

            typeChar();
        }

        function skipTyping() {
            if (isTyping) {
                clearTimeout(typingTimeout);
                dialogueElement.textContent = currentText;
                isTyping = false;
                nextArrow.classList.add('visible');
            }
        }

        function makeChoice(text) {
            if (choiceMade) return;
            choiceMade = true;

            yesButton.classList.add('hidden');
            noButton.classList.add('hidden');

            setTimeout(() => {
                dialogueBox.classList.add('visible');
                typeText(text);
            }, 400);
        }

        yesButton.addEventListener('click', (e) => {
            e.stopPropagation();
            makeChoice('JAGAJSHDJDHJDHDJDD');
        });

        noButton.addEventListener('click', (e) => {
            e.stopPropagation();
            makeChoice('puto');
        });

        document.addEventListener('click', (e) => {
            if (e.target === yesButton || e.target === noButton) return;
            if (choiceMade && isTyping) skipTyping();
        });

        setTimeout(() => {
            yesButton.classList.add('visible');
            noButton.classList.add('visible');
        }, 2000);
    </script>
</body>
</html>
